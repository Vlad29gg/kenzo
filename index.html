  <style>
    :root{
      --bg:#030303;
      --card:#0a0a0b;
      --card2:#0f0f11;
      --line:rgba(255,255,255,.075);
      --text:#f5f5f6;
      --muted:#85858c;
      --red:#b90012;
      --red2:#ff2035;
      --redglow:rgba(185,0,18,.22);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at 50% -10%, rgba(190,0,18,.16), transparent 34%),
        radial-gradient(circle at 110% 95%, rgba(120,0,12,.08), transparent 28%),
        linear-gradient(180deg,#020202,#060606);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:36px 36px;
    }

    .app{
      position:relative;
      z-index:1;
      width:min(1040px,calc(100vw - 20px));
      height:calc(100dvh - 20px);
      max-height:820px;
      margin:10px auto;
      border:1px solid var(--line);
      border-radius:26px;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 25%,rgba(170,0,18,.07),transparent 34%),
        linear-gradient(180deg,rgba(14,14,16,.985),rgba(7,7,8,.99));
      box-shadow:0 26px 80px rgba(0,0,0,.62);
      display:grid;
      grid-template-rows:54px 1fr;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:7px 12px;
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.25);
    }

    .top-id{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .top-id img{
      width:38px;
      height:38px;
      object-fit:cover;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 7px 18px rgba(0,0,0,.38);
      flex:0 0 auto;
    }

    .top-id strong{
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .online{
      display:flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 9px;
      color:#bdbdc2;
      background:rgba(255,255,255,.02);
      font-size:8px;
      font-weight:800;
      letter-spacing:.13em;
      text-transform:uppercase;
    }

    .online::before{
      content:"";
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--red2);
      box-shadow:0 0 12px rgba(255,32,53,.95);
    }

    .content{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(240px,.82fr) minmax(340px,1.18fr);
      gap:22px;
      align-items:center;
      padding:18px 22px;
    }

    .profile{
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:12px;
    }

    .avatar-frame{
      width:clamp(145px,20vw,210px);
      aspect-ratio:1;
      border-radius:50%;
      padding:4px;
      background:linear-gradient(145deg,var(--red2),#520008 48%,rgba(255,255,255,.11));
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 0 38px rgba(190,0,18,.16),
        0 18px 46px rgba(0,0,0,.5);
    }

    .avatar-frame img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      border-radius:50%;
      filter:brightness(.86) contrast(1.1) saturate(.88);
    }

    h1{
      margin:0;
      font-size:clamp(40px,7.4vw,82px);
      line-height:.86;
      letter-spacing:-.055em;
      font-weight:950;
      text-transform:uppercase;
      background:linear-gradient(180deg,#fff,#d0d0d2 63%,#737379);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .phrase{
      margin:0;
      font-size:clamp(16px,2.2vw,23px);
      line-height:1.18;
      font-weight:760;
      color:#ededee;
      letter-spacing:-.02em;
    }

    .phrase::after{
      content:"";
      display:block;
      width:76px;
      height:2px;
      margin:9px auto 0;
      background:linear-gradient(90deg,transparent,var(--red2),transparent);
      box-shadow:0 0 12px rgba(255,32,53,.45);
    }

    .links{
      min-width:0;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      grid-template-rows:repeat(3,minmax(0,1fr));
      gap:10px;
      height:min(410px,56vh);
    }

    .social{
      position:relative;
      min-width:0;
      min-height:0;
      border:1px solid var(--line);
      border-radius:19px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.038),rgba(255,255,255,.012)),
        var(--card);
      text-decoration:none;
      color:var(--text);
      padding:13px 14px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      overflow:hidden;
      transition:.18s ease;
    }

    .social::before{
      content:"";
      position:absolute;
      width:100px;
      height:100px;
      right:-52px;
      top:-52px;
      border-radius:50%;
      background:radial-gradient(circle,var(--redglow),transparent 70%);
      pointer-events:none;
    }

    .social:hover{
      transform:translateY(-2px);
      border-color:rgba(255,32,53,.32);
      background:
        linear-gradient(145deg,rgba(175,0,18,.10),rgba(255,255,255,.015)),
        var(--card);
    }

    .social:active{
      transform:scale(.985);
    }

    .social-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .icon{
      width:36px;
      height:36px;
      border-radius:11px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.075);
      background:#111113;
    }

    .icon svg{
      width:20px;
      height:20px;
      display:block;
      fill:#f7f7f7;
    }

    .arrow{
      color:#626268;
      font-size:16px;
      line-height:1;
    }

    .social strong{
      display:block;
      font-size:13px;
      letter-spacing:.01em;
    }

    .social small{
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:9px;
    }

    @media(max-width:760px){
      .app{
        width:calc(100vw - 12px);
        height:calc(100dvh - 12px);
        margin:6px auto;
        border-radius:20px;
        grid-template-rows:48px 1fr;
      }

      .topbar{padding:5px 9px}
      .top-id img{width:34px;height:34px;border-radius:10px}
      .top-id strong{font-size:11px}
      .online{font-size:7px;padding:6px 8px}

      .content{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr;
        gap:8px;
        padding:9px 10px 10px;
        align-content:center;
      }

      .profile{gap:6px}

      .avatar-frame{
        width:clamp(92px,24vw,124px);
        padding:3px;
      }

      h1{font-size:clamp(30px,10vw,46px)}
      .phrase{font-size:clamp(13px,4.1vw,17px)}
      .phrase::after{margin-top:6px;width:58px}

      .links{
        height:100%;
        min-height:0;
        max-height:330px;
        grid-template-columns:repeat(2,minmax(0,1fr));
        grid-template-rows:repeat(3,minmax(0,1fr));
        gap:7px;
      }

      .social{
        border-radius:15px;
        padding:9px 10px;
      }

      .icon{
        width:29px;
        height:29px;
        border-radius:9px;
      }

      .icon svg{width:17px;height:17px}
      .social strong{font-size:11px}
      .social small{font-size:7px}
      .arrow{font-size:14px}
    }

    @media(max-width:390px){
      .top-id strong{font-size:10px}
      .avatar-frame{width:86px}
      h1{font-size:29px}
      .phrase{font-size:12.5px}
      .social{padding:8px 9px}
      .social small{display:none}
    }

    @media(max-height:680px){
      .app{
        height:calc(100dvh - 8px);
        margin:4px auto;
      }

      .content{
        padding-top:7px;
        padding-bottom:7px;
      }

      .avatar-frame{
        width:clamp(78px,17vh,112px);
      }

      h1{
        font-size:clamp(28px,6vh,44px);
      }

      .phrase{
        font-size:clamp(12px,2.6vh,16px);
      }

      .links{
        max-height:290px;
      }
    }

    @media(max-width:760px) and (max-height:560px){
      .content{
        grid-template-columns:.7fr 1.3fr;
        grid-template-rows:1fr;
        gap:8px;
      }

      .profile{gap:5px}
      .avatar-frame{width:76px}
      h1{font-size:27px}
      .phrase{font-size:11px}
      .phrase::after{margin-top:4px}

      .links{
        max-height:none;
        height:100%;
      }

      .social{
        padding:7px 8px;
      }

      .icon{
        width:26px;
        height:26px;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>
